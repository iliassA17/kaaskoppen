[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Public Firebase browser configuration, not an Admin/Stripe secret.
  # Keep secrets scanning enabled; allow only this exact public key.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC6mnjCOrhXb8GD8s5CKjgEhsr0izoOjz4"

[functions]
  # Compile ESM dependencies into the CommonJS handlers used by Lambda.
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Keep previous entry addresses working after introducing /app/.

[[redirects]]
  from = "/intro/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/intro/index.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/boekingen.html"
  to = "/app/"
  status = 302
  force = true
