[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Public Firebase browser configuration for BS test, not an Admin/Stripe secret.
  # Keep secrets scanning enabled; allow only this exact public key.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAd20JV7U52dVIP-9jP3XOvwkujR9AF7Lo"

[functions]
  # Compile ESM dependencies into the CommonJS handlers used by Lambda.
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Temporary redirects while the new entry layout is tried on the test site.
[[redirects]]
  from = "/intro/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/intro/index.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/boekingen.html"
  to = "/app/"
  status = 302
  force = true
